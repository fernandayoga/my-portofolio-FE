<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Squircle container with cyber border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0A0A0C" stroke="#D4F933" stroke-width="2" stroke-opacity="0.35"/>
  
  <!-- Subtle terminal glow -->
  <radialGradient id="cyber-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#D4F933" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#D4F933" stop-opacity="0"/>
  </radialGradient>
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#cyber-glow)"/>

  <!-- Terminal Chevron '>' -->
  <path d="M17 21L29 32L17 43" stroke="#D4F933" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Terminal Cursor '_' -->
  <path d="M35 43H47" stroke="#D4F933" stroke-width="5.5" stroke-linecap="round"/>
</svg>
